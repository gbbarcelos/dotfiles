windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule = float on, match:title Open Folder
windowrule = float on, match:class org.pulseaudio.pavucontrol
windowrule = float on, match:class steam, match:title Lista de amigos, size 300 600, move center
windowrule = float on, match:class steam, match:title Friends List,    size 300 600, move center
windowrule = opacity 1.0 override 1.0 override, match:class steam_app*
windowrule = opacity 0.92 override 0.82 override, match:class kitty
windowrule = opacity 0.90 override 0.85 override, match:class org.pwmt.zathura
layerrule = blur on,          match:namespace wofi
layerrule = ignore_alpha 0.1, match:namespace wofi
layerrule = blur on,          match:namespace waybar
layerrule = blur on,          match:namespace swaync-control-center
layerrule = ignore_alpha 0.2, match:namespace swaync-control-center
layerrule = blur on,          match:namespace swaync-notification-window
layerrule = ignore_alpha 0.2, match:namespace swaync-notification-window
layerrule = blur on, match:namespace wifi-manager
layerrule = ignore_alpha 0.3, match:namespace wifi-manager

