input {
    kb_layout  = br
    kb_variant = abnt2
    follow_mouse = 1
    sensitivity  = 0
    touchpad {
        natural_scroll      = true
        tap-to-click        = true
        disable_while_typing = true
        scroll_factor       = 0.8
    }
}
gestures {
    gesture = 3, horizontal, workspace
    gesture = 4, up, special
    gesture = 4, down, close
}
