general {
    disable_loading_bar    = true
    hide_cursor            = true
    grace                  = 0
    no_fade_in             = false
    no_fade_out            = false
    ignore_empty_input     = true
}

background {
    monitor  =
    path     = /home/bibi/imagens/wallpapers/totoro.jpg

    blur_passes   = 2
    blur_size     = 3
    brightness    = 0.9
    contrast      = 0.9
    vibrancy      = 0.0
}

label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +"%H:%M")"
    font_family = Cormorant Garamond Bold
    font_size   = 112
    color       = rgba(245, 242, 236, 0.95)

    shadow_passes = 0

    position  = 0, 60
    halign    = center
    valign    = center
}

label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +"%A, %d de %B de %Y")"
    font_family = Cormorant Garamond SemiBold
    font_size   = 22
    color       = rgba(235, 230, 220, 0.75)

    position  = 0, -42
    halign    = center
    valign    = center
}

label {
    monitor     =
    text        = ──────────
    font_family = Cormorant Garamond
    font_size   = 14
    color       = rgba(237, 235, 229, 0.21)

    position  = 0, -90
    halign    = center
    valign    = center
}

input-field {
    monitor  =
    size     = 260, 48

    inner_color      = rgba(250, 248, 244, 0.12)
    outer_color      = rgba(220, 215, 205, 0.35)
    check_color      = rgba(180, 160, 130, 0.80)
    fail_color       = rgba(190, 100, 90, 0.75)

    font_color       = rgba(245, 242, 236, 0.90)
    font_family      = JetBrainsMono Nerd Font

    placeholder_text = <span font_family="JetBrainsMono Nerd Font">󰌾</span>  <i>digite sua senha</i>
    fail_text        = <i>senha incorreta ($ATTEMPTS)</i>

    outline_thickness  = 1
    dots_size          = 0.22
    dots_spacing       = 0.25
    dots_center        = true
    dots_rounding      = -1

    rounding           = 4
    fade_on_empty      = true
    fade_timeout       = 3000

    position  = 0, -175
    halign    = center
    valign    = center
}