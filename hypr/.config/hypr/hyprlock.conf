input-field {
    monitor =
    size = 290, 60
    rounding = -1
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(40, 40, 40, 0.55)
    font_color = rgb(220, 220, 220)
    fade_on_empty = false
    font_family = Adwaita Sans
    placeholder_text = <i><span foreground="##dddddd">Digite sua senha</span></i>
    fail_text = <i>Senha incorreta ($ATTEMPTS)</i>
    hide_input = false
    shadow_color = rgba(0, 0, 0, 0)
    position = 0, -175
    halign = center
    valign = center
}

