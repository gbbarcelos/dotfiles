background {
    monitor  =
    path     = /home/bibi/Imagens/wallpapers/wh1.png
    blur_passes   = 0
    brightness    = 0.8
    contrast      = 0.8
    vibrancy      = 1.16
}
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color = rgba(230, 180, 50, 1)
    font_size = 110
    font_family = Adwaita Sans
    shadow_passes = 1
    shadow_size = 1
    shadow_color = rgba(0, 0, 0, 0.35)
    shadow_boost = 0.8
    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<b>$(date +"%A, %-d %B")</b>"
    color = rgba(220, 220, 220, 0.9)
    font_size = 22
    font_family = Adwaita Sans
    shadow_passes = 1
    shadow_size = 1
    shadow_color = rgba(0, 0, 0, 0.35)
    shadow_boost = 0.8
    position = 0, 175
    halign = center
    valign = center
}

# Bateria
label {
    monitor =
    text = cmd[update:10000] c=$(cat /sys/class/power_supply/BAT0/capacity); s=$(cat /sys/class/power_supply/BAT0/status); en=$(cat /sys/class/power_supply/BAT0/energy_now); ef=$(cat /sys/class/power_supply/BAT0/energy_full); pw=$(cat /sys/class/power_supply/BAT0/power_now); i=󰁺; [ "$c" -ge 20 ] && i=󰁼; [ "$c" -ge 40 ] && i=󰁾; [ "$c" -ge 60 ] && i=󰂀; [ "$c" -ge 80 ] && i=󰂂; [ "$c" -ge 95 ] && i=󰁹; m=0; [ "$pw" -gt 0 ] && { [ "$s" = Charging ] && m=$(( (ef - en) * 60 / pw )) || m=$(( en * 60 / pw )); }; t="$((m / 60))h $((m % 60))min"; [ "$m" -lt 60 ] && t="$((m % 60))min"; case "$s" in Charging) i=󰂄; st="carregando"; [ "$m" -gt 0 ] && st="$st, $t até 100%";; Discharging) st="descarregando"; [ "$m" -gt 0 ] && st="$st, $t restantes";; Full) st="carregada";; *) st="conectada na tomada";; esac; out="$c% <span font_family=\"JetBrainsMono Nerd Font Propo\">$i </span> - $st"; echo "<b>$out</b>"
    color = rgba(220, 220, 220, 0.9)
    font_size = 16
    font_family = Adwaita Sans
    shadow_passes = 1
    shadow_size = 1
    shadow_color = rgba(0, 0, 0, 0.35)
    shadow_boost = 0.8
    position = 0, 40
    halign = center
    valign = bottom
}

# Bluetooth
label {
    monitor =
    text = cmd[update:10000] bt=$(bluetoothctl devices Connected 2>/dev/null | cut -d" " -f3- | paste -sd "," | sed -e "s/,/, /g" -e "s/&/\&amp;/g" -e "s/</\&lt;/g"); [ -n "$bt" ] && echo "<b><span font_family=\"JetBrainsMono Nerd Font Propo\">󰂱 </span>$bt</b>"
    color = rgba(220, 220, 220, 0.9)
    font_size = 16
    font_family = Adwaita Sans
    shadow_passes = 1
    shadow_size = 1
    shadow_color = rgba(0, 0, 0, 0.35)
    shadow_boost = 0.8
    position = 0, 75
    halign = center
    valign = bottom
}

